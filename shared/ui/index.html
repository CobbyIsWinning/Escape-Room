<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#f3e7d3}
body{font:17px/1.7 Georgia,serif;padding:2px 1px 6px}
.dialogue{white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.7em;margin:0}
.caret{display:inline-block;width:2px;height:1em;vertical-align:-.1em;background:#dfbd7a;margin-left:3px;animation:blink 1s steps(1) infinite}
.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.status{font:10px/1.3 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#c5aa7c}
button{font:11px system-ui,sans-serif;color:#d8c5a1;background:transparent;border:1px solid #655035;border-radius:20px;padding:5px 10px;cursor:pointer}
button:hover{background:#3b3023}button:focus-visible{outline:2px solid #dfbd7a;outline-offset:3px}
@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.caret{animation:none}}
</style>
</head>
<body>
<p class="dialogue"><span id="words"></span><span id="caret" class="caret" aria-hidden="true"></span></p>
<div class="controls"><span id="status" class="status" aria-live="polite">Morvan’s words gather…</span><button id="skip" type="button">Show all</button></div>
<script>
let options=null, letters=[], currentIdentity=null;
const words=document.getElementById('words');
const caret=document.getElementById('caret');
const status=document.getElementById('status');
const button=document.getElementById('skip');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let index=0, timer=null, running=false, lastHeight=0;
function resize(){const height=document.body.scrollHeight+4;if(height===lastHeight)return;lastHeight=height;window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height},'*')}
function finish(){
 clearTimeout(timer);index=letters.length;words.textContent=options.text;running=false;
 caret.hidden=true;status.textContent='The wizard awaits your move';button.textContent='Replay text';resize();
}
function tick(){
 if(index>=letters.length){finish();return}
 words.textContent+=letters[index++];resize();
 const last=letters[index-1];timer=setTimeout(tick,/[.!?…]/.test(last)?200:/[,;:]/.test(last)?90:18);
}
function begin(delay=0){
 clearTimeout(timer);index=0;words.textContent='';running=true;caret.hidden=false;
 status.textContent=delay?'You begin to wake…':'Morvan is speaking…';button.textContent='Show all';resize();
 timer=setTimeout(()=>{status.textContent='Morvan is speaking…';tick()},delay);
}
button.addEventListener('click',()=>{if(running||reduced)finish();else begin()});
new ResizeObserver(resize).observe(document.body);
window.addEventListener('pagehide',()=>clearTimeout(timer));
window.addEventListener('message',event=>{
 if(event.source!==window.parent||event.data?.type!=='streamlit:render')return;
 const incoming=event.data.args;
 if(incoming.identity===currentIdentity){resize();return}
 options=incoming;currentIdentity=options.identity;letters=Array.from(options.text);
 if(options.animate&&!reduced)begin(options.delay_ms);else finish();
});
window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');
</script>
</body>
</html>
